<div class="view teams-view">
  <header class="view-header"><div><h1 class="view-title">Equipos</h1><p class="view-subtitle text-muted">Tareas y conversaciones compartidas en tiempo real.</p></div><div class="header-actions"><button class="btn btn-ghost" id="join-team-btn">Unirse con código</button><button class="btn btn-primary" id="create-team-btn">+ Nuevo equipo</button></div></header>
  <div id="teams-list" class="teams-list"></div>
  <section id="team-detail" class="team-detail" hidden><div class="team-detail-header"><button class="btn btn-ghost btn-sm" id="back-teams-btn">← Volver</button><div><h2 class="team-name" id="team-detail-name"></h2><p class="text-muted" id="team-detail-role"></p></div><div class="team-actions"><button class="btn btn-ghost btn-sm" id="invite-btn">Copiar código</button><button class="btn btn-danger btn-sm" id="delete-or-leave-btn"></button></div></div><div class="team-body"><div class="team-tasks-col"><div class="section-header"><h3 class="section-title">Tareas del equipo</h3><button class="btn btn-primary btn-sm" id="team-new-task-btn">+ Tarea</button></div><div id="team-tasks-list" class="task-list"></div></div><div class="team-members-col"><h3 class="section-title">Miembros</h3><div id="team-members-list" class="team-members-list"></div><div class="team-chat"><h3 class="section-title">Chat del equipo</h3><div id="team-chat-messages" class="team-chat-messages" aria-live="polite"></div><div class="team-chat-input-row"><input class="form-input" id="team-chat-input" maxlength="2000" placeholder="Escribe un mensaje…"><button class="btn btn-primary btn-sm" id="team-send-btn">Enviar</button></div></div></div></div></section>
</div>
<script>
(() => {
  let activeTeam=null, teams=[], channel=null, members=[], profiles=new Map();
  const $=id=>document.getElementById(id), esc=v=>FlowHelpers.escapeHTML(String(v||'')), cloud=()=>FlowSupabase.isConfigured();
  const fail=e=>FlowApp.toast(e.message||'No se pudo completar la acción','error');
  async function setProfiles(ids){ profiles=new Map((await FlowSupabase.getProfiles(ids)).map(p=>[p.id,p])); }
  async function list(){ const el=$('teams-list'); teams=cloud()?await FlowSupabase.getMyTeams():[]; if(!teams.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">👥</div><p>Aún no perteneces a ningún equipo.</p><p class="text-muted">Crea uno o usa un código de invitación.</p><button class="btn btn-primary" id="empty-create-team">Crear equipo</button></div>';$('empty-create-team')?.addEventListener('click',create);return;} el.innerHTML=teams.map(t=>`<button class="team-card" data-id="${t.id}"><div class="team-card-icon">${esc(t.icon||'👥')}</div><div class="team-card-info"><div class="team-card-name">${esc(t.name)}</div><div class="team-card-desc">${esc(t.description||'Sin descripción')}</div><div class="team-card-meta"><span class="meta-tag">${esc(t.myRole||'miembro')}</span></div></div><span>→</span></button>`).join('');el.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.id))); }
  async function open(id){ activeTeam=teams.find(t=>t.id===id);if(!activeTeam)return;$('teams-list').hidden=true;$('team-detail').hidden=false;$('team-detail-name').textContent=activeTeam.name;$('team-detail-role').textContent=`Tu rol: ${activeTeam.myRole||'miembro'}`;const owner=activeTeam.owner_id===FlowState.get('user.id')||activeTeam.myRole==='admin';$('delete-or-leave-btn').textContent=owner?'Eliminar equipo':'Salir del equipo';$('invite-btn').hidden=!owner;await refresh();FlowSupabase.unsubscribe(channel);channel=FlowSupabase.subscribeToTeam(id,()=>refresh().catch(fail)); }
  async function refresh(){if(!activeTeam)return;[members,activeTeam.tasks,activeTeam.messages]=await Promise.all([FlowSupabase.getTeamMembers(activeTeam.id),FlowSupabase.getTeamTasks(activeTeam.id),FlowSupabase.getTeamMessages(activeTeam.id)]);await setProfiles([...members.map(x=>x.user_id),...activeTeam.messages.map(x=>x.user_id),...activeTeam.tasks.map(x=>x.assigned_to).filter(Boolean)]);drawMembers();drawTasks();drawMessages();}
  function drawMembers(){$('team-members-list').innerHTML=members.map(m=>{const p=profiles.get(m.user_id)||{},n=p.name||'Miembro',c=p.accent_color||'#6366f1';return `<div class="team-member-item"><div class="user-avatar" style="width:32px;height:32px;font-size:.75rem;background:${esc(c)}">${esc(n.slice(0,2).toUpperCase())}</div><div><div style="font-size:.875rem;font-weight:500">${esc(n)}</div><div style="font-size:.72rem;color:var(--text-muted)">${esc(m.role)}</div></div></div>`}).join('')||'<div class="empty-state-sm">No hay miembros.</div>';}
  function drawTasks(){const ts=activeTeam.tasks||[];$('team-tasks-list').innerHTML=ts.length?ts.map(t=>`<div class="task-card priority-${esc(t.priority||'none')}"><div class="task-card-main"><button class="task-check ${t.completed?'checked':''}" data-complete="${t.id}" aria-label="Completar tarea"></button><div class="task-card-body"><div class="task-card-title ${t.completed?'completed':''}">${esc(t.title)}</div>${t.description?`<div class="task-card-desc">${esc(t.description)}</div>`:''}<div class="task-card-meta">${t.due_date?`<span>${esc(t.due_date)}</span>`:''}${t.assigned_to?`<span> · ${esc(profiles.get(t.assigned_to)?.name||'Asignada')}</span>`:''}</div></div></div><button class="icon-btn" data-delete="${t.id}" aria-label="Eliminar tarea">🗑</button></div>`).join(''):'<div class="empty-state-sm">Sin tareas. Crea la primera para el equipo.</div>';$('team-tasks-list').querySelectorAll('[data-complete]').forEach(b=>b.addEventListener('click',()=>FlowSupabase.updateTeamTask(b.dataset.complete,{completed:!b.classList.contains('checked')}).catch(fail)));$('team-tasks-list').querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>{if(confirm('¿Eliminar esta tarea del equipo?'))FlowSupabase.removeTeamTask(b.dataset.delete).catch(fail)}));}
  function drawMessages(){const me=FlowState.get('user.id'),ms=activeTeam.messages||[];$('team-chat-messages').innerHTML=ms.length?ms.map(m=>{const p=profiles.get(m.user_id)||{};return `<div class="chat-message ${m.user_id===me?'mine':''}"><span class="chat-author">${esc(p.name||'Miembro')}</span><span class="chat-text">${esc(m.content)}</span><span class="chat-time">${new Date(m.created_at).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}</span></div>`}).join(''):'<div class="empty-state-sm">Aún no hay mensajes.</div>';$('team-chat-messages').scrollTop=$('team-chat-messages').scrollHeight;}
  function create(){FlowApp.showModal({title:'Nuevo equipo',content:'<form id="team-form" class="task-form"><div class="form-group"><label class="form-label">Nombre del equipo</label><input class="form-input" name="name" required maxlength="80" autofocus></div><div class="form-group"><label class="form-label">Descripción</label><textarea class="form-input" name="description" maxlength="300"></textarea></div><button class="btn btn-primary" type="submit">Crear equipo</button></form>'});$('team-form')?.addEventListener('submit',async e=>{e.preventDefault();try{const f=new FormData(e.target);await FlowSupabase.createTeam(f.get('name').trim(),f.get('description').trim());FlowApp.closeModal();await list();FlowApp.toast('Equipo creado. Ya puedes invitar personas.','success')}catch(x){fail(x)}})}
  function join(){FlowApp.showModal({title:'Unirse a un equipo',content:'<form id="join-form" class="task-form"><div class="form-group"><label class="form-label">Código de invitación</label><input class="form-input" name="code" required maxlength="32" style="text-transform:uppercase" autofocus></div><button class="btn btn-primary" type="submit">Unirse</button></form>'});$('join-form')?.addEventListener('submit',async e=>{e.preventDefault();try{await FlowSupabase.joinTeam(new FormData(e.target).get('code'));FlowApp.closeModal();await list();FlowApp.toast('Te uniste al equipo.','success')}catch(x){fail(x)}})}
  function task(){FlowApp.showModal({title:'Nueva tarea de equipo',content:'<form id="team-task-form" class="task-form"><div class="form-group"><label class="form-label">Título</label><input class="form-input" name="title" required maxlength="160" autofocus></div><div class="form-group"><label class="form-label">Descripción</label><textarea class="form-input" name="description" maxlength="1000"></textarea></div><div class="form-group"><label class="form-label">Fecha límite</label><input class="form-input" type="date" name="dueDate"></div><button class="btn btn-primary" type="submit">Crear tarea</button></form>'});$('team-task-form')?.addEventListener('submit',async e=>{e.preventDefault();try{const f=new FormData(e.target);await FlowSupabase.createTeamTask(activeTeam.id,{title:f.get('title').trim(),description:f.get('description').trim(),dueDate:f.get('dueDate')});FlowApp.closeModal()}catch(x){fail(x)}})}
  async function send(){const i=$('team-chat-input'),text=i.value.trim();if(!text)return;i.value='';try{await FlowSupabase.sendTeamMessage(activeTeam.id,text)}catch(x){i.value=text;fail(x)}}
  async function remove(){const owner=activeTeam.owner_id===FlowState.get('user.id')||activeTeam.myRole==='admin',action=owner?'eliminar permanentemente este equipo y todo su contenido':'salir de este equipo';if(!confirm(`¿Seguro que deseas ${action}?`))return;try{if(owner)await FlowSupabase.deleteTeam(activeTeam.id);else await FlowSupabase.leaveTeam(activeTeam.id);back();await list();FlowApp.toast(owner?'Equipo eliminado':'Saliste del equipo','success')}catch(x){fail(x)}}
  function back(){FlowSupabase.unsubscribe(channel);channel=null;activeTeam=null;$('teams-list').hidden=false;$('team-detail').hidden=true;}
  $('create-team-btn').addEventListener('click',create);$('join-team-btn').addEventListener('click',join);$('back-teams-btn').addEventListener('click',back);$('team-new-task-btn').addEventListener('click',task);$('team-send-btn').addEventListener('click',send);$('team-chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send()}});$('delete-or-leave-btn').addEventListener('click',remove);$('invite-btn').addEventListener('click',async()=>{try{await FlowHelpers.copyToClipboard(activeTeam.invite_code);FlowApp.toast('Código copiado: '+activeTeam.invite_code,'success')}catch(x){fail(x)}});
  if(!cloud())$('teams-list').innerHTML='<div class="empty-state"><div class="empty-icon">☁️</div><p>Conecta Supabase para usar Equipos.</p><p class="text-muted">Configura la URL y clave pública de Supabase.</p></div>';else list().catch(fail);
})();
</script>
