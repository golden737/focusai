<!-- ── Habits View ─────────────────────────────────────────────────────────── -->
<div class="view habits-view">
  <header class="view-header">
    <div><h1 class="view-title">Hábitos</h1><p class="view-subtitle text-muted" id="habits-date"></p></div>
    <div class="header-actions">
      <button class="btn btn-primary" id="new-habit-btn">+ Nuevo hábito</button>
    </div>
  </header>

  <!-- Stats del día -->
  <div class="habits-day-stats">
    <div class="day-stat"><span class="day-stat-value" id="h-done">0</span><span class="day-stat-label">Completados</span></div>
    <div class="day-stat"><span class="day-stat-value" id="h-total">0</span><span class="day-stat-label">Total hoy</span></div>
    <div class="day-stat"><span class="day-stat-value" id="h-rate">0%</span><span class="day-stat-label">Cumplimiento</span></div>
    <div class="day-stat"><span class="day-stat-value" id="h-streak">0</span><span class="day-stat-label">Mejor racha</span></div>
    <div class="habits-day-bar"><div class="habits-day-fill" id="h-day-fill" style="width:0%"></div></div>
  </div>

  <!-- Lista de hábitos de hoy -->
  <section class="habits-section">
    <h2 class="section-title">Hoy</h2>
    <div id="habits-today-list" class="habits-grid"></div>
  </section>

  <!-- Grilla semanal -->
  <section class="habits-section">
    <h2 class="section-title">Esta semana</h2>
    <div id="habits-week-grid" class="habits-week-grid"></div>
  </section>

  <!-- Estadísticas -->
  <section class="habits-section">
    <h2 class="section-title">Cumplimiento — últimas 4 semanas</h2>
    <div class="chart-container" style="height:160px"><canvas id="habits-compliance-chart"></canvas></div>
  </section>

  <!-- Todos los hábitos -->
  <section class="habits-section">
    <div class="section-header">
      <h2 class="section-title">Todos los hábitos</h2>
      <label class="checkbox-label"><input type="checkbox" id="show-archived"> Mostrar archivados</label>
    </div>
    <div id="habits-all-list" class="habits-all-list"></div>
  </section>
</div>

<script>
(function(){
  function init(){
    _t('habits-date', FlowDate.format(new Date(),'dddd, DD de MMMM'));
    _render();
    _bind();
    FlowState.subscribe('habits.items', _render);
    FlowState.subscribe('habits.logs',  _render);
  }

  function _render(){
    _renderStats();
    _renderToday();
    _renderWeekGrid();
    _renderAll();
    FlowCharts.bar('habits-compliance-chart', FlowStats.getHabitComplianceByWeek(), { plugins:{legend:{display:false}}, scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'}}} });
  }

  function _renderStats(){
    const s=FlowHabits.getStats();
    _t('h-done',   s.todayDone);
    _t('h-total',  s.todayTotal);
    _t('h-rate',   s.todayRate+'%');
    _t('h-streak', s.bestStreak);
    const fill=document.getElementById('h-day-fill');
    if(fill) fill.style.width=s.todayRate+'%';
  }

  function _renderToday(){
    const el=document.getElementById('habits-today-list'); if(!el) return;
    const habits=FlowHabits.getTodayHabits();
    if(!habits.length){ el.innerHTML='<div class="empty-state-sm">Sin hábitos programados para hoy. <button class="btn btn-ghost btn-sm" onclick="document.getElementById(\'new-habit-btn\').click()">Crear uno</button></div>'; return; }
    el.innerHTML=habits.map(h=>`
      <div class="habit-card ${h.todayComplete?'habit-done':''}">
        <div class="habit-card-icon" style="background:${h.color||'#6366f1'}22;color:${h.color||'#6366f1'}">${h.icon||'⭐'}</div>
        <div class="habit-card-body">
          <div class="habit-card-name">${FlowHelpers.escapeHTML(h.name)}</div>
          ${h.streak>1?`<div class="habit-streak-badge">🔥 ${h.streak} días</div>`:''}
          <div class="habit-progress-row">
            ${Array.from({length:h.targetCount},(_,i)=>`<div class="habit-pip ${i<h.todayCount?'filled':''}" style="background:${i<h.todayCount?(h.color||'#6366f1'):''}"></div>`).join('')}
          </div>
        </div>
        <div class="habit-card-actions">
          ${!h.todayComplete?`<button class="btn btn-primary btn-sm" onclick="FlowHabits.complete('${h.id}')">✓ Completar</button>`
            :`<button class="btn btn-ghost btn-sm" onclick="FlowHabits.uncomplete('${h.id}')">↩ Deshacer</button>`}
          <button class="icon-btn" onclick="_editHabit('${h.id}')" title="Editar">✏️</button>
        </div>
      </div>`).join('');
  }

  function _renderWeekGrid(){
    const el=document.getElementById('habits-week-grid'); if(!el) return;
    const habits=(FlowState.get('habits.items')||[]).filter(h=>!h.archived);
    if(!habits.length){ el.innerHTML=''; return; }
    const days=['L','M','X','J','V','S','D'];
    el.innerHTML=`
      <div class="week-grid-header">
        <div class="week-grid-name"></div>
        ${FlowDate.getWeekDays().map(d=>`<div class="week-grid-day ${d.isToday?'today':''}">${FlowDate.format(new Date(d.date+'T12:00:00'),'ddd')}<br><small>${FlowDate.format(new Date(d.date+'T12:00:00'),'D')}</small></div>`).join('')}
      </div>
      ${habits.map(h=>{
        const week=FlowHabits.getWeekGrid(h.id);
        return `<div class="week-grid-row">
          <div class="week-grid-name">${h.icon||'⭐'} ${FlowHelpers.escapeHTML(h.name)}</div>
          ${week.map(d=>`<div class="week-grid-cell ${d.complete===true?'done':d.complete===false?'missed':''} ${d.date===FlowDate.today()?'today':''}"
            title="${d.date}">${d.complete===true?'✓':d.complete===false?'·':''}</div>`).join('')}
        </div>`;
      }).join('')}`;
  }

  function _renderAll(){
    const el=document.getElementById('habits-all-list'); if(!el) return;
    const showArch=document.getElementById('show-archived')?.checked||false;
    const habits=(FlowState.get('habits.items')||[]).filter(h=>showArch||!h.archived);
    el.innerHTML=habits.map(h=>`
      <div class="habit-row">
        <span class="habit-row-icon">${h.icon||'⭐'}</span>
        <div class="habit-row-info">
          <span class="habit-row-name">${FlowHelpers.escapeHTML(h.name)}</span>
          <span class="habit-row-meta">${_freqLabel(h.frequency)} · Racha: ${h.streak} · Total: ${h.totalCompleted}</span>
        </div>
        <span class="habit-rate">${FlowHabits.getCompletionRate(h.id)}%</span>
        <div class="habit-row-actions">
          <button class="icon-btn btn-sm" onclick="_editHabit('${h.id}')">✏️</button>
          <button class="icon-btn btn-sm" onclick="FlowHabits.archive('${h.id}')">📦</button>
          <button class="icon-btn btn-sm" onclick="if(confirm('¿Eliminar?'))FlowHabits.remove('${h.id}')">🗑</button>
        </div>
      </div>`).join('') || '<div class="empty-state-sm">Sin hábitos</div>';
  }

  function _freqLabel(f){
    if(f==='daily') return 'Diario';
    if(f==='weekdays') return 'Días laborables';
    if(f==='weekends') return 'Fines de semana';
    if(Array.isArray(f)) return f.map(d=>['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][d]).join(', ');
    return f;
  }

  function _editHabit(id){
    const h=FlowState.array.find('habits.items',x=>x.id===id); if(!h) return;
    FlowApp.showModal({ title:'Editar hábito', size:'md', content:`
      <form id="habit-form" class="task-form">
        <input type="hidden" name="id" value="${id}">
        <div class="form-row">
          <div class="form-group" style="flex:0 0 60px"><label class="form-label">Icono</label><input class="form-input" name="icon" value="${h.icon||'⭐'}" maxlength="2"></div>
          <div class="form-group"><label class="form-label">Nombre *</label><input class="form-input" name="name" value="${FlowHelpers.escapeHTML(h.name)}" required></div>
        </div>
        <div class="form-group"><label class="form-label">Descripción</label><input class="form-input" name="description" value="${FlowHelpers.escapeHTML(h.description||'')}"></div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Frecuencia</label>
            <select class="form-input form-select" name="frequency">
              <option value="daily" ${h.frequency==='daily'?'selected':''}>Diario</option>
              <option value="weekdays" ${h.frequency==='weekdays'?'selected':''}>Días laborables</option>
              <option value="weekends" ${h.frequency==='weekends'?'selected':''}>Fines de semana</option>
            </select>
          </div>
          <div class="form-group"><label class="form-label">Recordatorio</label><input class="form-input" type="time" name="reminderTime" value="${h.reminderTime||''}"></div>
          <div class="form-group"><label class="form-label">Color</label><input class="form-input" type="color" name="color" value="${h.color||'#6366f1'}"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" onclick="FlowApp.closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>`
    });
    setTimeout(()=>{
      document.getElementById('habit-form')?.addEventListener('submit',async e=>{
        e.preventDefault();
        const fd=new FormData(e.target);
        await FlowHabits.update(id,{ name:fd.get('name'), description:fd.get('description'), icon:fd.get('icon'), frequency:fd.get('frequency'), reminderTime:fd.get('reminderTime')||null, color:fd.get('color') });
        FlowApp.closeModal();
      });
    },50);
  }
  window._editHabit=_editHabit;

  function _bind(){
    document.getElementById('new-habit-btn')?.addEventListener('click',()=>{
      FlowApp.showModal({ title:'Nuevo hábito', size:'md', content:`
        <form id="habit-form" class="task-form">
          <div class="form-row">
            <div class="form-group" style="flex:0 0 60px"><label class="form-label">Icono</label><input class="form-input" name="icon" value="⭐" maxlength="2"></div>
            <div class="form-group"><label class="form-label">Nombre *</label><input class="form-input" name="name" placeholder="Ej: Meditación" required autofocus></div>
          </div>
          <div class="form-group"><label class="form-label">Descripción</label><input class="form-input" name="description" placeholder="Opcional"></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Frecuencia</label>
              <select class="form-input form-select" name="frequency">
                <option value="daily">Diario</option>
                <option value="weekdays">Días laborables</option>
                <option value="weekends">Fines de semana</option>
              </select>
            </div>
            <div class="form-group"><label class="form-label">Recordatorio</label><input class="form-input" type="time" name="reminderTime"></div>
            <div class="form-group"><label class="form-label">Color</label><input class="form-input" type="color" name="color" value="#6366f1"></div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-ghost" onclick="FlowApp.closeModal()">Cancelar</button>
            <button type="submit" class="btn btn-primary">Crear hábito</button>
          </div>
        </form>`
      });
      setTimeout(()=>{
        document.getElementById('habit-form')?.addEventListener('submit',async e=>{
          e.preventDefault();
          const fd=new FormData(e.target);
          await FlowHabits.create({ name:fd.get('name'), description:fd.get('description'), icon:fd.get('icon'), frequency:fd.get('frequency'), reminderTime:fd.get('reminderTime')||null, color:fd.get('color') });
          FlowApp.closeModal();
        });
      },50);
    });
    document.getElementById('show-archived')?.addEventListener('change', _renderAll);
  }

  function _t(id,text){ const el=document.getElementById(id); if(el) el.textContent=text; }
  init();
})();
</script>
