  <template id="view-tpl-gamification">
<!-- ── Gamification View ──────────────────────────────────────────────────── -->
<div class="view gamification-view">
  <header class="view-header">
    <h1 class="view-title">Logros y Gamificación</h1>
  </header>

  <!-- Perfil de nivel -->
  <div class="level-card">
    <div class="level-avatar" id="gam-avatar">FM</div>
    <div class="level-info">
      <div class="level-name" id="gam-name">Usuario</div>
      <div class="level-title" id="gam-level-title">Nivel 1 — Principiante</div>
      <div class="level-xp-bar">
        <div class="level-xp-fill" id="gam-xp-fill" style="width:0%"></div>
      </div>
      <div class="level-xp-text" id="gam-xp-text">0 / 100 XP</div>
    </div>
    <div class="level-stats">
      <div class="lstat"><span id="gam-badges-count">0</span><small>Insignias</small></div>
      <div class="lstat"><span id="gam-week-pts">0</span><small>Puntos semana</small></div>
      <div class="lstat"><span id="gam-streak">0</span><small>Racha</small></div>
    </div>
  </div>

  <!-- Desafíos semanales -->
  <section class="gam-section">
    <h2 class="section-title">🏅 Desafíos de esta semana</h2>
    <div id="gam-challenges" class="gam-challenges"></div>
  </section>

  <!-- Insignias -->
  <section class="gam-section">
    <div class="section-header">
      <h2 class="section-title">🏆 Insignias</h2>
      <span class="badge-progress" id="gam-badge-progress"></span>
    </div>
    <div id="gam-badges" class="gam-badges-grid"></div>
  </section>
</div>

<script>
(function(){
  function init(){
    _render();
    FlowState.subscribe('gamification', _render);
  }

  function _render(){
    _renderProfile();
    _renderChallenges();
    _renderBadges();
  }

  function _renderProfile(){
    const s    = FlowGamification.getStats();
    const name = FlowState.get('user.name')||'Usuario';
    const levelTitles = ['','Principiante','Aprendiz','Practicante','Experto','Maestro','Leyenda'];
    const title = levelTitles[Math.min(s.level, levelTitles.length-1)] || 'Leyenda';

    _t('gam-avatar',       (name).substring(0,2).toUpperCase());
    _t('gam-name',         name);
    _t('gam-level-title',  `Nivel ${s.level} — ${title}`);
    _t('gam-xp-text',      `${s.xp} / ${s.needed} XP`);
    _t('gam-badges-count', s.badgesUnlocked);
    _t('gam-week-pts',     s.weekPoints);
    _t('gam-badge-progress',`${s.badgesUnlocked}/${s.badgesTotal}`);

    const fill = document.getElementById('gam-xp-fill');
    if(fill) fill.style.width = s.pct+'%';

    const streak = FlowState.get('gamification.streak')||0;
    _t('gam-streak', streak);
  }

  function _renderChallenges(){
    const el = document.getElementById('gam-challenges'); if(!el) return;
    const ch = FlowGamification.getWeeklyChallenges();
    if(!ch.length){ el.innerHTML='<div class="empty-state-sm">Los desafíos se generan automáticamente cada semana</div>'; return; }
    el.innerHTML = ch.map(c=>{
      const pct = Math.min(100, Math.round((c.progress/c.target)*100));
      return `<div class="challenge-card ${c.completed?'completed':''}">
        <div class="challenge-card-header">
          <span class="challenge-card-name">${c.completed?'✅ ':''} ${c.name}</span>
          <span class="challenge-xp-badge">+${c.xp} XP</span>
        </div>
        <p class="challenge-card-desc">${c.desc}</p>
        <div class="challenge-bar-wrap">
          <div class="challenge-bar"><div class="challenge-fill" style="width:${pct}%"></div></div>
          <span class="challenge-pct">${pct}%</span>
        </div>
        <div class="challenge-progress-text">${c.progress} / ${c.target}</div>
      </div>`;
    }).join('');
  }

  function _renderBadges(){
    const el     = document.getElementById('gam-badges'); if(!el) return;
    const badges = FlowGamification.getBadges();
    el.innerHTML = badges.map(b=>`
      <div class="badge-card ${b.unlocked?'unlocked':'locked'}" title="${b.desc}">
        <div class="badge-emoji">${b.emoji}</div>
        <div class="badge-name">${b.name}</div>
        <div class="badge-desc">${b.desc}</div>
        ${b.unlocked?`<div class="badge-date">${FlowDate.format(new Date(b.unlockedAt),'DD MMM')}</div>`:'<div class="badge-locked">🔒 Bloqueado</div>'}
        ${b.xp>0?`<div class="badge-xp">+${b.xp} XP</div>`:''}
      </div>`).join('');
  }

  function _t(id,text){ const el=document.getElementById(id); if(el) el.textContent=text; }
  init();
})();
</script>

      <label class="toggle-label"><input type="checkbox" id="s-notif-report" checked> Reporte semanal</label>

        <button class="btn btn-ghost" id="export-csv-btn">📊 Exportar tareas CSV</button>
      </div>

      <h2 class="settings-section-title">⚠️ Zona de peligro</h2>

<script>
(function(){
  function init(){
    _loadSettings();
    _checkNotifPermission();
    _loadStorageInfo();
    _bind();
  }

  function _loadSettings(){
    const user = FlowState.get('user')||{};
    const sets = FlowState.get('settings')||{};
    const ai   = FlowState.get('ai')||{};
    const notif= FlowState.get('notifications.settings')||{};

    _val('s-name',        user.name||'');
    _val('s-email',       user.email||'');
    _val('s-ai-provider', ai.provider||'ollama');
    _val('s-ai-url',      ai.baseUrl||'http://localhost:11434');
    _val('s-ai-model',    ai.model||'llama3.2');
    _val('s-ai-temp',     ai.temperature??0.7);
    _val('s-ai-tokens',   ai.maxTokens||1024);
    _val('s-time-format', sets.timeFormat||'24h');
    _val('s-week-start',  sets.weekStartsOn??1);

    const theme = FlowState.get('user.theme')||'dark';
    document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active', b.dataset.theme===theme));

    const cb=(id,val)=>{ const el=document.getElementById(id); if(el) el.checked=val!==false; };
    cb('s-notif-tasks',  notif.taskReminders);
    cb('s-notif-habits', notif.habitReminders);
    cb('s-notif-focus',  notif.focusAlerts);
    cb('s-notif-report', notif.weeklyReport);
  }

  async function _checkNotifPermission(){
    const perm = FlowState.get('notifications.permission');
    const banner = document.getElementById('notif-permission-banner');
    if(banner) banner.hidden = perm==='granted';
  }

  async function _loadStorageInfo(){
    const info = await FlowStorage.estimateSize();
    const el   = document.getElementById('storage-info');
    if(el && info) el.textContent = `Almacenamiento usado: ${info.usageMB} MB de ${info.quotaMB} MB disponibles`;
  }

  function _bind(){
    document.getElementById('save-settings-btn')?.addEventListener('click', _save);

    // Tema
    document.querySelectorAll('.theme-btn').forEach(btn=>{
      btn.addEventListener('click',()=>{
        document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        FlowApp.setTheme(btn.dataset.theme);
      });
    });

    // Proveedor IA → actualizar URL
    document.getElementById('s-ai-provider')?.addEventListener('change', e=>{
      const urls={ollama:'http://localhost:11434',lmstudio:'http://localhost:1234',jan:'http://localhost:1337',localai:'http://localhost:8080'};
      _val('s-ai-url', urls[e.target.value]||'');
    });

    // Detectar modelos
    document.getElementById('detect-models-btn')?.addEventListener('click', async ()=>{
      const btn=document.getElementById('detect-models-btn');
      btn.textContent='⏳ Buscando…'; btn.disabled=true;
      // Guardar URL/provider antes de detectar
      FlowAI.saveConfig({ provider:_gval('s-ai-provider'), baseUrl:_gval('s-ai-url') });
      const models = await FlowAI.listModels();
      const listEl = document.getElementById('model-list');
      if(listEl){
        listEl.hidden=false;
        listEl.innerHTML = models.length
          ? models.map(m=>`<button class="model-option" onclick="document.getElementById('s-ai-model').value='${m}';document.querySelectorAll('.model-option').forEach(b=>b.classList.remove('active'));this.classList.add('active')">${m}</button>`).join('')
          : '<span class="text-muted">No se encontraron modelos. ¿Está Ollama ejecutándose?</span>';
      }
      btn.textContent='🔍 Detectar'; btn.disabled=false;
    });

    // Test conexión
    document.getElementById('test-ai-btn')?.addEventListener('click', async ()=>{
      const badge=document.getElementById('ai-status-badge');
      if(badge){ badge.textContent='Probando…'; badge.className='status-badge'; }
      FlowAI.saveConfig({ provider:_gval('s-ai-provider'), baseUrl:_gval('s-ai-url'), model:_gval('s-ai-model') });
      const result = await FlowAI.testConnection();
      if(badge){
        badge.textContent = result.ok ? `✅ Conectado · ${result.models?.length||0} modelos` : `❌ ${result.error}`;
        badge.className   = 'status-badge '+(result.ok?'ok':'error');
      }
    });

    // Notificaciones
    document.getElementById('request-notif-btn')?.addEventListener('click', async ()=>{
      await FlowNotifications.requestPermission();
      _checkNotifPermission();
    });

    // Exportar
    document.getElementById('export-data-btn')?.addEventListener('click', ()=>FlowAuth.exportData());
    document.getElementById('export-csv-btn')?.addEventListener('click', async ()=>{
      const csv=await FlowStorage.exportCSV('tasks');
      FlowHelpers.downloadCSV(csv, `focusai-tasks-${FlowDate.today()}.csv`);
    });

    // Importar
    document.getElementById('import-file')?.addEventListener('change', async e=>{
      const file=e.target.files?.[0]; if(!file) return;
      if(confirm('¿Importar datos? Esto reemplazará todos tus datos actuales.')) await FlowAuth.importData(file);
    });

    // Eliminar datos
    document.getElementById('clear-data-btn')?.addEventListener('click', ()=>FlowAuth.clearAllData());
  }

  async function _save(){
    FlowAuth.updateProfile({ name:_gval('s-name'), email:_gval('s-email') });
    FlowAI.saveConfig({ provider:_gval('s-ai-provider'), baseUrl:_gval('s-ai-url'), model:_gval('s-ai-model'), temperature:parseFloat(_gval('s-ai-temp')), maxTokens:parseInt(_gval('s-ai-tokens')) });
    FlowState.update('settings',{ timeFormat:_gval('s-time-format'), weekStartsOn:parseInt(_gval('s-week-start')) });
    FlowState.update('notifications.settings',{
      taskReminders:  document.getElementById('s-notif-tasks')?.checked,
      habitReminders: document.getElementById('s-notif-habits')?.checked,
      focusAlerts:    document.getElementById('s-notif-focus')?.checked,
      weeklyReport:   document.getElementById('s-notif-report')?.checked,
    });
    FlowState.persist();
    FlowApp.toast('Ajustes guardados ✓', 'success');
  }

  function _val(id,v){ const el=document.getElementById(id); if(el) el.value=v; }
  function _gval(id){ return document.getElementById(id)?.value||''; }
  init();
})();
</script>

  </template>
