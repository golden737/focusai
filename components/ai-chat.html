<!-- ── AI Chat Component ──────────────────────────────────────────────────── -->
<div class="ai-chat">
 <div class="ai-chat-header">
 <div class="ai-chat-title">
 <span class="ai-chat-icon" aria-hidden="true"></span>
 <div>
 <div class="ai-chat-name">Asistente FocusAI</div>
 <div class="ai-chat-status" id="ai-chat-status">Listo para ayudarte</div>
 </div>
 </div>
 <div class="ai-chat-header-actions">
 <button class="icon-btn btn-sm" id="ai-clear-btn" title="Limpiar chat"></button>
 <button class="icon-btn btn-sm" id="ai-close-btn" title="Cerrar"></button>
 </div>
 </div>

 <!-- Sugerencias rápidas -->
 <div class="ai-quick-actions">
 <span class="ai-quick-label">Prueba con</span>
 <button class="ai-quick-btn" data-prompt="Planifica mi día de hoy"> Planificar día</button>
 <button class="ai-quick-btn" data-prompt="¿Tengo sobrecarga de trabajo?"> Detectar sobrecarga</button>
 <button class="ai-quick-btn" data-prompt="Sugiere prioridades para mis tareas"> Prioridades</button>
 <button class="ai-quick-btn" data-prompt="Dame un resumen de mi productividad de hoy"> Resumen del día</button>
 </div>

 <!-- Mensajes -->
 <div class="ai-chat-messages" id="ai-messages">
 <div class="ai-message ai-message-bot">
 <div class="ai-message-bubble">
 ¡Hola! Soy tu asistente FocusAI. Puedo ayudarte a planificar tu día, organizar tareas y entender tu productividad. ¿Qué necesitas resolver?
 </div>
 </div>
 </div>

 <!-- Indicador de escritura -->
 <div class="ai-thinking" id="ai-thinking" hidden>
 <div class="ai-thinking-dots"><span></span><span></span><span></span></div>
 <span>Pensando…</span>
 </div>

 <!-- Input -->
 <div class="ai-chat-input-row">
 <div class="ai-chat-input-wrap"><textarea class="ai-chat-input" id="ai-chat-input" rows="1" placeholder="Escribe tu mensaje…" maxlength="2000"></textarea><span class="ai-input-hint">Enter para enviar · Shift + Enter para nueva línea</span></div>
 <button class="btn btn-primary ai-send-btn" id="ai-send-btn">↑</button>
 </div>
</div>

<script>
(function(){
 function init(){
 _loadHistory();
 _updateStatus();
 _bind();
 FlowState.subscribe('ai.isThinking', _updateThinking);
 FlowState.subscribe('ai.chatHistory', _syncMessages);
 }

 function _updateStatus(){
 const el = document.getElementById('ai-chat-status');
 if(!el) return;
 if(FlowAI.isConfigured()){
 el.textContent = 'Listo para ayudarte';
 el.dataset.configured = 'true';
 } else {
 el.textContent = ' Sin configurar — ve a Ajustes';
  el.dataset.configured = 'false';
 }
 }

 function _loadHistory(){
 const history = FlowState.get('ai.chatHistory')||[];
 if(history.length > 0){
 const el = document.getElementById('ai-messages');
 if(el) el.innerHTML = history.slice(-30).map(_renderMessage).join('');
 _scrollToBottom();
 }
 }

 function _syncMessages(){
 const history = FlowState.get('ai.chatHistory')||[];
 const el = document.getElementById('ai-messages');
 if(!el) return;
 const followLatest = _isNearBottom(el);
 const previousTop = el.scrollTop;
 el.innerHTML = history.slice(-30).map(_renderMessage).join('');
 if(followLatest) _scrollToBottom('smooth');
 else el.scrollTop = previousTop;
 }

 function _renderMessage(m){
 const isBot = m.role === 'assistant';
 const time = m.ts ? new Date(m.ts).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}) : '';
 const content = isBot ? FlowAI.sanitizeAssistantText(m.content) : String(m.content || '');
 const safeContent = content || (isBot ? 'No pude interpretar esa respuesta. Intenta preguntarlo de otra manera.' : '');
 return `<div class="ai-message ${isBot?'ai-message-bot':'ai-message-user'}">
 <div class="ai-message-bubble">${FlowHelpers.nl2br(FlowHelpers.escapeHTML(safeContent))}</div>
 <div class="ai-message-time">${time}</div>
 </div>`;
 }

 async function _send(){
 const input = document.getElementById('ai-chat-input');
 const text = input?.value.trim();
 if(!text) return;
 if(!FlowAI.isConfigured()){
 FlowApp.toast('Configura la IA local en Ajustes primero','warning');
 FlowRouter.navigate('settings');
 return;
 }
 input.value = '';
 input.style.height = 'auto';

 try {
 const pending = FlowAI.chat(text);
 _scrollToBottom('smooth');
 await pending;
 } catch(e) {
 // FlowAI ya registra los errores en el historial; evitar mensajes duplicados.
 }
 }

 function _appendMessage(m){
 const el = document.getElementById('ai-messages');
 if(!el) return;
 const div = document.createElement('div');
 div.innerHTML = _renderMessage(m);
 el.appendChild(div.firstElementChild);
 _scrollToBottom();
 }

 function _updateThinking(isThinking){
 const el = document.getElementById('ai-thinking');
 if(el) el.hidden = !isThinking;
 const btn = document.getElementById('ai-send-btn');
 if(btn) btn.disabled = isThinking;
 const messages=document.getElementById('ai-messages');
 if(messages&&_isNearBottom(messages)) _scrollToBottom('smooth');
 }

 function _isNearBottom(el){
 return el.scrollHeight - el.scrollTop - el.clientHeight < 100;
 }

 function _scrollToBottom(behavior='auto'){
 const el = document.getElementById('ai-messages');
 if(el) requestAnimationFrame(()=>{ el.scrollTo({top:el.scrollHeight,behavior}); });
 }

 function _bind(){
 const input = document.getElementById('ai-chat-input');
 const send = document.getElementById('ai-send-btn');

 input?.addEventListener('keydown', e=>{
 if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); _send(); }
 });
 input?.addEventListener('input', ()=>{
 input.style.height='auto';
 input.style.height=Math.min(120, input.scrollHeight)+'px';
 });
 send?.addEventListener('click', _send);

 document.querySelectorAll('.ai-quick-btn').forEach(btn=>{
 btn.addEventListener('click',()=>{
 const input=document.getElementById('ai-chat-input');
 if(input){ input.value=btn.dataset.prompt; _send(); }
 });
 });

 document.getElementById('ai-clear-btn')?.addEventListener('click',()=>{
 if(confirm('¿Limpiar historial del chat?')){
 FlowAI.clearHistory();
 const el=document.getElementById('ai-messages');
 if(el) el.innerHTML='<div class="ai-message ai-message-bot"><div class="ai-message-bubble">Chat limpiado. ¿En qué te ayudo?</div></div>';
 }
 });

 document.getElementById('ai-close-btn')?.addEventListener('click',()=>{
 FlowState.set('ai.panelOpen', false);
 });
 }

 init();
})();
</script>
