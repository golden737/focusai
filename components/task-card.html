<!-- ── Task Card Component ───────────────────────────────────────────────── -->
<!-- Componente reutilizable de tarjeta de tarea.
     Uso: se genera dinámicamente desde tasks.js con _taskCard(task)
     Este archivo sirve como referencia de la estructura HTML. -->
<div class="task-card priority-{priority}" data-task-id="{id}">
  <div class="task-card-main">
    <button class="task-check" data-complete="{id}" aria-label="Completar tarea">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
    </button>
    <div class="task-card-body">
      <div class="task-card-title">{title}</div>
      <div class="task-card-desc">{description}</div>
      <div class="task-card-meta">
        <span class="meta-tag">{dueDate}</span>
        <span class="meta-tag">⏱ {estimatedMin}m</span>
        <span class="label-tag">{label}</span>
        <span class="meta-tag">☑ {subtasksDone}/{subtasksTotal}</span>
      </div>
    </div>
    <div class="task-card-actions">
      <button class="icon-btn btn-sm" data-ai-estimate="{id}" title="Estimar con IA">⏱</button>
      <button class="icon-btn btn-sm" data-edit="{id}" title="Editar">✏️</button>
      <button class="icon-btn btn-sm" data-delete="{id}" title="Eliminar">🗑</button>
    </div>
  </div>
  <div class="subtask-list">
    <div class="subtask-item">
      <button class="subtask-check">☐</button>
      <span>{subtask.title}</span>
    </div>
  </div>
</div>
